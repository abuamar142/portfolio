name: Deploy Portfolio to VPS

# `development` is deliberately NOT listed: the dev stack (dev.abuamar.online,
# portfolio-dev.abuamar.online) was decommissioned on 2026-11-04 to free VPS
# resources. Auto-deploying it would resurrect a vhost that no longer exists.
# Use workflow_dispatch for an ad-hoc deploy of another branch.
#
# pull_request runs `check` only: the deploy job is gated on the event name, so
# a PR gets lint + type-check + tests without touching the VPS. The same gate
# keeps workflow_dispatch usable for ad-hoc deploys of any branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only needs to read the repo. Without this it
# inherits the repository default, which can include write scopes.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run lint:check
      - run: bun run type-check
      - run: bun run test

  deploy:
    needs: check
    # PRs run `check` for feedback only; the VPS is written on push to main or
    # an explicit workflow_dispatch (which may target another branch).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # `check` already ran install + lint + type-check + tests on this exact
      # commit, so deploy only adds the design-system gate and ships.
      - name: Impeccable design-system detect
        run: npx -y impeccable@4.1.0 detect src

      # The VPS login shell is bash (since 2026-09-25); run the deploy script
      # directly. appleboy/ssh-action already runs with `-e -o pipefail` and the
      # script has its own `set -euo pipefail`, so no wrapper is needed.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: BRANCH
          script: |
            /opt/ops/bin/deploy-portfolio.sh "$BRANCH"
