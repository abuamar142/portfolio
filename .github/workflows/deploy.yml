name: Deploy Portfolio to VPS

on:
  push:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only needs to read the repo. Without this it
# inherits the repository default, which can include write scopes.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx eslint .
      - run: bun run type-check
      - run: bun run test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Quality gates: never ship without lint + design-system detection.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint check (no autofix)
        run: bun run lint:check
      - name: Unit tests
        run: bun run test
      - name: Impeccable design-system detect
        run: npx -y impeccable@4.1.0 detect src

      # The VPS login shell is bash (since 2026-09-25); run the deploy script
      # directly. appleboy/ssh-action already runs with `-e -o pipefail` and the
      # script has its own `set -euo pipefail`, so no wrapper is needed.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: BRANCH
          script: |
            /opt/ops/bin/deploy-portfolio.sh "$BRANCH"
