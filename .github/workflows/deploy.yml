name: Deploy Portfolio to VPS

on:
  push:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The VPS login shell is fish, which rejects POSIX `VAR="..."` syntax;
      # hand the whole script to bash explicitly (pipefail logic unchanged).
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            bash -lc 'set -euo pipefail; BRANCH="${{ github.ref_name }}"; echo "Deploying branch: $BRANCH"; /opt/ops/bin/deploy-portfolio.sh "$BRANCH"'
