<!doctype html>
<html lang="id" style="color-scheme: light">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F3F4EF" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2315171B'/><text x='16' y='22' text-anchor='middle' fill='%23F0F2F4' font-family='JetBrains Mono, monospace' font-size='17' font-weight='700'>A</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="keywords"
      content="Software Engineer, Mobile Developer, Full Stack Developer, Flutter, Vue, React, Supabase, Yogyakarta"
    />
    <meta name="author" content="M. Abu Amar Al Badawi" />

    <!-- Anti-FOUC theme paint: MUST stay above every <link rel="stylesheet">
         below. Stylesheets block inline scripts, so anywhere under the fonts
         link re-opens a white-canvas window on slow devices before the dark
         theme lands (intermittent white flash on reload/back in dark mode). -->
    <script>
      // Paint the resolved theme before first paint (anti-FOUC for SSG).
      // Mirrors src/composables/useTheme.ts: 'portfolio-theme' -> data-theme.
      (function () {
        try {
          const mode = localStorage.getItem('portfolio-theme') || 'system'
          const dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          const root = document.documentElement
          if (dark) root.setAttribute('data-theme', 'portfolio-dark')
          else root.removeAttribute('data-theme')
          root.style.colorScheme = dark ? 'dark' : 'light'
          root.style.setProperty('--prep-bg', dark ? '#14161a' : '#f3f4ef')
          const colorScheme = document.querySelector('meta[name="color-scheme"]')
          if (colorScheme) colorScheme.setAttribute('content', dark ? 'dark' : 'light')
          const themeColor = document.querySelector('meta[name="theme-color"]')
          if (themeColor) themeColor.setAttribute('content', dark ? '#14161a' : '#F3F4EF')
        } catch {}
      })()
    </script>
    <style>
      html,
      body {
        background: var(--prep-bg, #f3f4ef);
      }
    </style>
  
    <!-- Site-wide description + OG/Twitter meta live in src/App.vue (with
         per-page overrides in each page's useHead); unhead dedupes and
         prerenders them. Do not re-add copies here. -->

    <!-- Fonts: Newsreader (display) · Source Serif 4 (body) · IBM Plex Sans (chrome) · IBM Plex Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap"
      rel="stylesheet"

    <noscript>

        rel="stylesheet"

    <title>M. Abu Amar Al Badawi - Portfolio</title>
